services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: solopos_membership
      MYSQL_ROOT_PASSWORD: secret
      TZ: Asia/Jakarta
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mysql_data: